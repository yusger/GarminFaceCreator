<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">BYOD round layout proposal</title><desc id="desc">Two columns and three rows fit within a 203-unit safe circle on a 454-unit round screen. The second example merges A through D for a large clock. Proposal only.</desc><rect width="1000" height="540" fill="#0e1720"/><g transform="translate(28 45)"><circle cx="227" cy="227" r="227" fill="#050a10" stroke="#4b6375"/><circle cx="227" cy="227" r="203" fill="none" stroke="#315165" stroke-dasharray="5 6"/><rect x="91" y="91" width="126" height="80" rx="10" fill="#16374a" stroke="#65c7bb"/><text x="154" y="139" fill="#dbefef" font-size="28" text-anchor="middle">A</text><rect x="237" y="91" width="126" height="80" rx="10" fill="#16374a" stroke="#65c7bb"/><text x="300" y="139" fill="#dbefef" font-size="28" text-anchor="middle">B</text><rect x="91" y="187" width="126" height="80" rx="10" fill="#16374a" stroke="#65c7bb"/><text x="154" y="235" fill="#dbefef" font-size="28" text-anchor="middle">C</text><rect x="237" y="187" width="126" height="80" rx="10" fill="#16374a" stroke="#65c7bb"/><text x="300" y="235" fill="#dbefef" font-size="28" text-anchor="middle">D</text><rect x="91" y="283" width="126" height="80" rx="10" fill="#16374a" stroke="#65c7bb"/><text x="154" y="331" fill="#dbefef" font-size="28" text-anchor="middle">E</text><rect x="237" y="283" width="126" height="80" rx="10" fill="#16374a" stroke="#65c7bb"/><text x="300" y="331" fill="#dbefef" font-size="28" text-anchor="middle">F</text><text x="227" y="-16" fill="#dbefef" font-size="22" text-anchor="middle">Six independent fields</text></g><g transform="translate(528 45)"><circle cx="227" cy="227" r="227" fill="#050a10" stroke="#4b6375"/><circle cx="227" cy="227" r="203" fill="none" stroke="#315165" stroke-dasharray="5 6"/><rect x="91" y="91" width="272" height="176" rx="12" fill="#16374a" stroke="#65c7bb"/><text x="227" y="165" fill="#dbefef" font-size="24" text-anchor="middle">A + B + C + D</text><text x="227" y="218" fill="#65c7bb" font-size="42" text-anchor="middle">09:41</text><rect x="91" y="283" width="126" height="80" rx="10" fill="#16374a" stroke="#65c7bb"/><text x="154" y="331" fill="#dbefef" font-size="28" text-anchor="middle">E</text><rect x="237" y="283" width="126" height="80" rx="10" fill="#16374a" stroke="#65c7bb"/><text x="300" y="331" fill="#dbefef" font-size="28" text-anchor="middle">F</text><text x="227" y="-16" fill="#dbefef" font-size="22" text-anchor="middle">Four cells + two fields</text></g><text x="500" y="524" fill="#93aebe" font-size="16" text-anchor="middle">Architecture proposal - illustrative fonts, not a native screenshot</text></svg>
