services:
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile.runtime
    ports:
      - "${GFC_BIND_ADDRESS:-0.0.0.0}:${GFC_HTTP_PORT:-18380}:8080"
    environment:
      GFC_LOGS: /data/logs
      GFC_GEOIP: /data/geoip
      GFC_BUILD_PER_MINUTE: ${GFC_BUILD_PER_MINUTE:-6}
      GFC_BUILD_PER_DAY: ${GFC_BUILD_PER_DAY:-30}
      GFC_GLOBAL_BUILD_PER_DAY: ${GFC_GLOBAL_BUILD_PER_DAY:-200}
      GFC_API_PER_MINUTE: ${GFC_API_PER_MINUTE:-240}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    volumes:
      - ./runtime/jobs:/data/jobs
      - ./backend/Logs:/data/logs
      - ./runtime/geoip:/data/geoip:ro
      - ./runtime/sdk:/opt/connectiq:ro
      - ./runtime/garmin:/home/app/.Garmin/ConnectIQ:ro
      - ./runtime/secrets/developer_key:/run/secrets/developer_key:ro
    mem_limit: 1536m
    cpus: 2
    pids_limit: 150
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL