services:
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile.runtime
    ports:
      - "${GFC_BIND_ADDRESS:-0.0.0.0}:${GFC_HTTP_PORT:-18380}:8080"
    environment:
      GFC_LOGS: /data/logs
      GFC_GEOIP: /data/geoip
    # Optional standard .NET environment overrides; defaults live in backend/appsettings.json.
    env_file:
      - path: ./runtime/backend.env
        required: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    volumes:
      - ./backend/appsettings.json:/app/appsettings.json:ro
      - ./runtime/jobs:/data/jobs
      - ./backend/Logs:/data/logs
      - ./runtime/geoip:/data/geoip:ro
      - ./runtime/sdk:/opt/connectiq:ro
      - ./runtime/garmin:/home/app/.Garmin/ConnectIQ:ro
      - ./runtime/secrets/developer_key:/run/secrets/developer_key:ro
    mem_limit: 1536m
    cpus: 2
    pids_limit: 150
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL