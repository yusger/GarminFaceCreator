name: Bug 报告 / Bug report
description: 提供复现步骤与脱敏的环境信息 / Report a reproducible problem
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: 请勿填写 API Key、密码、SSH 凭据、私人主机地址或未脱敏的个人健康数据。日志与截图请先脱敏。 / Redact keys, credentials, private hosts, and personal health data.
  - type: textarea
    id: environment
    attributes:
      label: 环境 / Environment
      description: 程序版本或 commit、浏览器/操作系统、目标系列/型号/尺寸和分辨率、Connect IQ SDK 及设备固件版本；无关项填不适用。
      placeholder: "App commit: ...; Browser: ...; Device: Venu 4 45mm / 454×454; SDK: ...; Firmware: ..."
    validations:
      required: true
  - type: dropdown
    id: location
    attributes:
      label: 出现位置 / Where
      options:
        - 网页编辑器 / Editor
        - 网页预览 / Web preview
        - AI 生成 / AI generation
        - 编译服务 / Compiler
        - Connect IQ 模拟器 / Simulator
        - 手表真机 / Physical watch
        - 其他 / Other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤 / Steps
      description: 从新项目还是参考副本开始？使用哪些控件、数据源、语言和 AOD 模式？尽量提供最小复现。
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: 预期与实际 / Expected and actual
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏日志与截图 / Redacted logs and screenshots
      description: 保留错误行、文件相对路径和阶段；不需要 API Key 或完整浏览器存储。生成错误注明服务商与模型 ID，编译错误附相关日志。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认 / Privacy
      options:
        - label: 已移除 Key、密码、私网地址和个人数据 / I removed secrets and private data.
          required: true
