# Add after compose.yaml (and any image-selection override).
# Requires Docker Compose >= 2.24.4 for !reset.
services:
  app:
    ports: !reset []
    environment:
      GFC_TRUSTED_PROXY: 172.30.88.2
    networks: !override
      https_proxy:
        ipv4_address: 172.30.88.3
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
  caddy:
    image: ${GFC_CADDY_IMAGE:-garminfacecreator-caddy:local}
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/caddy"]
    command: ["run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    user: "1654:1654"
    environment:
      GFC_PUBLIC_HOST: ${GFC_PUBLIC_HOST:?Set GFC_PUBLIC_HOST}
      GFC_PUBLIC_PORT: ${GFC_HTTP_PORT:-61888}
      HOME: /tmp
      XDG_DATA_HOME: /data
      XDG_CONFIG_HOME: /config
    env_file:
      - ./runtime/secrets/tencentcloud.env
    ports:
      - "${GFC_BIND_ADDRESS:-0.0.0.0}:${GFC_HTTP_PORT:-61888}:${GFC_HTTP_PORT:-61888}/tcp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./runtime/caddy/data:/data
      - ./runtime/caddy/config:/config
    networks:
      default: {}
      https_proxy:
        ipv4_address: 172.30.88.2
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
networks:
  https_proxy:
    internal: true
    ipam:
      config:
        - subnet: 172.30.88.0/29
